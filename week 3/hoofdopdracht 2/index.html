<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pizza Counter</title>
        <style>
            body { font-family: Arial, sans-serif; text-align:center; padding:40px; }
            #pizzaWrap { font-size:48px; margin:20px 0; }
            #counterElement { font-size:32px; margin:10px 0; }
            button { font-size:18px; padding:10px 18px; margin:6px; cursor:pointer; }
            #message { margin-top:10px; font-size:18px; color:#444; }
            /* overlay */
            #overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; }
            #overlayPanel { background:#fff; padding:30px 40px; border-radius:8px; text-align:center; box-shadow:0 6px 20px rgba(0,0,0,0.3); }
            #overlayPanel h2 { margin:0 0 10px; font-size:36px; letter-spacing:2px; }
            #overlayPanel button { margin-top:12px; }
        </style>
        <script src="script.js" defer></script>
</head>
<body>
    
    <h1 id="counterElement">0 pizza!</h1>
    <div id="pizzaWrap">🍕</div>
    <div>
        <button id="addBtn">Give it to me!</button>
        <button id="resetBtn">Reset</button>
    </div>
    <div id="message"></div>

    <div id="overlay">
        <div id="overlayPanel">
            <h2>YOU WON!</h2>
            <p>Je hebt genoeg pizza's verzameld 🍕</p>
            <button id="playAgainBtn">Play again!</button>
        </div>
    </div>
</body>
</html>
